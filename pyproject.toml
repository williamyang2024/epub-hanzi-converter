[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "epub-hanzi-converter"
version = "0.1.0"
description = "Convert Chinese text in EPUB books locally with OpenCC"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["opencc-python-reimplemented>=0.1.7,<0.2"]

[project.scripts]
epub-hanzi = "epub_hanzi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
